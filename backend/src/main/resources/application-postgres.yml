spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cloudnine}
    username: ${DATABASE_USER:cloudnine}
    password: ${DATABASE_PASSWORD:cloudnine}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/postgres
