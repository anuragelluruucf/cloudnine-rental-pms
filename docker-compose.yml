services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudnine
      POSTGRES_USER: cloudnine
      POSTGRES_PASSWORD: cloudnine
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnine -d cloudnine"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://db:5432/cloudnine
      DATABASE_USER: cloudnine
      DATABASE_PASSWORD: cloudnine
      JWT_SECRET: dev-only-cloudnine-local-secret-key
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4173:80"
    depends_on:
      - backend
